[package]
name = "dupli"
version = "0.1.0"
description = "Keeps a copy of a folder in step with the original, on any drive."
edition = "2021"
rust-version = "1.88"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
dupli-core = { path = "../core" }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSError"] }
block2 = "0.6"
